name: Update event data

on:
  schedule:
    # KST 00:00 = UTC 15:00
    - cron: "0 19 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-event-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Update TourAPI events
        env:
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
        run: |
          python scripts/update_events.py

      - name: Update Culture Portal events
        env:
          CULTURE_API_KEY: ${{ secrets.CULTURE_API_KEY }}
        run: |
          python scripts/update_culture_events.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/events.json data/culture_events.json

          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi

          git commit -m "Update event data"

          git pull --rebase origin main
          git push origin main